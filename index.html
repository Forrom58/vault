<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b2a3a">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' blob: data:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Vault">
<title>Vault</title>
<style>
  :root{--bg:#1b2a3a;--text:#a3b2c2;--accent:#7f96ad;--btn:#2e4760;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);font-size:20px;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.4;min-height:100vh;
    padding:calc(20px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));}
  .wrap{max-width:520px;margin:0 auto;}
  .title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:28px;}
  h1{font-size:1.5rem;margin:0;}
  .ver{font-size:.8rem;color:var(--accent);white-space:nowrap;}
  a.big{display:block;text-align:center;text-decoration:none;font-size:1.15rem;font-weight:700;
    border:2px solid var(--accent);border-radius:10px;padding:16px;margin-bottom:16px;color:var(--text);background:var(--btn);}
  a.big:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
</style>
</head>
<body>
<main class="wrap">
  <div class="title"><h1>Vault</h1><span class="ver"></span></div>
  <a class="big" href="viewer.html">Consulta</a>
  <a class="big" href="editor.html">Registra</a>
</main>
<script src="sw-register.js"></script>
</body>
</html>
